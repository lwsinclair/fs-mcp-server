[project]
name = "fs-mcp"
version = "0.1.0"
description = "Universal File Reader MCP Server - 通用文件读取器 MCP 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 使用新的FastMCP 2.0，移除旧的mcp[cli]
    "fastmcp>=2.0.0",
    "pydantic>=2.11.5",
    "httpx>=0.24.0",
    "python-dotenv>=1.1.0",
    "aiohttp>=3.12.7",
    # 文件读取器依赖
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "python-docx>=0.8.11",
    "pdfplumber>=0.7.0",
    "PyPDF2>=3.0.0",
    # 代码搜索依赖
    "schedule>=1.2.0",
    # LangChain和向量搜索依赖
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

# 扩展PDF处理功能
enhanced-pdf = [
    "pymupdf>=1.20.0",  # fitz库，更强大的PDF处理能力
]

# 更好的文件类型检测
enhanced-detection = [
    "python-magic>=0.4.24",  # 更准确的MIME类型检测
    "chardet>=5.0.0",        # 字符编码检测
]

[project.scripts]
# 可执行脚本
file-reader-test = "test_file_reader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
